[project]
name = "jaagir-sathi-backend"
version = "0.1.0"
description = "AI Resume Matcher & Mock Interview Platform — backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "email-validator>=2.2",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "python-multipart>=0.0.12",
    "pdfplumber>=0.11",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "boto3>=1.35",
    "rq>=2.0",
    "redis>=5.2",
    "google-genai>=0.3",
    "tenacity>=9.0",
    "slowapi>=0.1.9",
    # ElevenLabs has no official async SDK worth the dependency — it's one POST.
    # (Was already present transitively as a test dependency; now it's declared.)
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
